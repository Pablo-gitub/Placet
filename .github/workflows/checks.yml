name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check documentation links and anchors
        run: python scripts/check_docs.py
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Test frontend (including locale parity and both languages)
        run: npm --prefix frontend test
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Build PWA
        run: npm --prefix frontend run build
      # API integration tests also verify serving the built PWA.
      - name: Test backend, bridge and hooks (including backend catalogs)
        run: python -m pytest -q
